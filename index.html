<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400;1,600;1,700;1,800" rel="stylesheet">

  <style>
@font-face {
  font-family: "Styrene A";
  src: url("https://assets.claude.ai/Fonts/AnthropicSans-Display-Medium-Static.otf") format("opentype");
  font-weight: 500; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Styrene B";
  src: url("https://assets.claude.ai/Fonts/AnthropicSans-Text-Medium-Static.otf") format("opentype");
  font-weight: 500; font-style: normal; font-display: swap;
  -webkit-font-smoothing: antialiased;
}
@font-face {
  font-family: "Styrene B";
  src: url("https://assets.claude.ai/Fonts/AnthropicSans-Text-Regular-Static.otf") format("opentype");
  font-weight: 400; font-style: normal; font-display: swap;
  -webkit-font-smoothing: antialiased;
}
@font-face {
  font-family: "Copernicus";
  src: url("https://assets.claude.ai/Fonts/AnthropicSerif-Display-Regular-Static.otf") format("opentype");
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Copernicus";
  src: url("https://assets.claude.ai/Fonts/AnthropicSerif-Display-Semibold-Static.otf") format("opentype");
  font-weight: 600; font-style: normal; font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Styrene B", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: #faf9f6;
  color: #2c2b25;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: inherit; text-decoration: none; }

/* Header */
#header {
  background-color: #f0eee6;
  border-bottom: 1px solid #e5e2d9;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
}
#header-left { display: flex; align-items: center; gap: 0.875rem; }
.header-logo-link { display: flex; align-items: center; }
.header-logo-link img { height: 13px; width: auto; }
#header-right { display: flex; align-items: center; gap: 1.5rem; }
.header-link {
  color: #141413;
  font-size: 0.9375rem;
  font-family: "Styrene B", sans-serif;
}

/* Main */
main { flex: 1; padding: 3rem 2rem 5rem; }
.page-wrapper { max-width: 1200px; margin: 0 auto; }

.page-title {
  font-family: "Copernicus", Georgia, serif;
  font-size: 2.25rem;
  font-weight: 400;
  color: #2c2b25;
  margin: 0 0 0.75rem;
  letter-spacing: -0.01em;
}
.page-subtitle {
  font-size: 1.0625rem;
  color: #5e5b4e;
  margin: 0 0 3rem;
  line-height: 1.6;
}

/* Course grid */
.course-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.5rem;
}

/* Course card */
.course-card {
  background: #fff;
  border: 1px solid #e5e2d9;
  border-radius: 10px;
  overflow: hidden;
  transition: box-shadow 0.15s ease, transform 0.15s ease;
  display: flex;
  flex-direction: column;
}
.course-card:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.10);
  transform: translateY(-2px);
}
.course-card-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  background: #E3DACC;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.course-card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.course-card-body {
  padding: 1.25rem 1.25rem 1.5rem;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.course-card-badge {
  display: inline-block;
  background: rgba(44,43,37,0.08);
  color: #7c7968;
  font-size: 0.75rem;
  font-weight: 500;
  padding: 0.2rem 0.6rem;
  border-radius: 4px;
  margin-bottom: 0.75rem;
  font-family: "Styrene B", sans-serif;
}
.course-card-title {
  font-family: "Copernicus", Georgia, serif;
  font-size: 1.25rem;
  font-weight: 400;
  color: #2c2b25;
  margin: 0 0 0.625rem;
  line-height: 1.25;
  letter-spacing: -0.01em;
}
.course-card-desc {
  font-size: 0.9rem;
  color: #5e5b4e;
  line-height: 1.55;
  margin: 0 0 1.25rem;
  flex: 1;
}
.course-card-meta {
  display: flex;
  align-items: center;
  gap: 1rem;
  font-size: 0.8125rem;
  color: #7c7968;
  font-family: "Styrene B", sans-serif;
  margin-bottom: 1rem;
}
.course-card-meta span { display: flex; align-items: center; gap: 0.3rem; }
.course-card-link {
  display: inline-block;
  background: #2c2b25;
  color: #fff;
  font-size: 0.9rem;
  font-weight: 500;
  font-family: "Styrene B", sans-serif;
  padding: 0.625rem 1.25rem;
  border-radius: 7px;
  align-self: flex-start;
  transition: background 0.15s;
}
.course-card-link:hover { background: #141413; }

/* Footer — dark bar */
.ant-footer {
  background-color: #141413;
  padding: 0;
}
.ant-footer-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem 2rem 0;
}
.ant-footer-logo { padding-bottom: 1.5rem; }
.ant-footer-divider { border-top: 1px solid #2c2b25; }
.ant-footer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 0 1.5rem;
  flex-wrap: wrap;
  gap: 0.75rem;
}
.ant-footer-copy { color: #7c7968; font-size: 0.8125rem; margin: 0; }
.ant-footer-social { display: flex; align-items: center; gap: 1.25rem; }
.ant-footer-social a { color: #7c7968; display: flex; }

/* Skilljar footer */
#ep-footer {
  background-color: #faf9f6;
  padding: 0.625rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#ep-footer span { color: #7c7968; font-size: 0.8125rem; }
#ep-footer a { display: flex; align-items: center; gap: 0.375rem; text-decoration: none; }
#ep-footer .powered-by { color: #9a9788; font-size: 0.75rem; }
#ep-footer img { height: 14px; width: auto; opacity: 0.6; }

@media (max-width: 640px) {
  #header { padding: 0 1rem; }
  main { padding: 2rem 1rem 4rem; }
  .page-title { font-size: 1.75rem; }
}
  </style>
</head>
